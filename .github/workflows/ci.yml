name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Every test is pure or mocks fetch, so nothing here reaches the NCL
      # library site — CI must not depend on a third party staying up.
      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck
